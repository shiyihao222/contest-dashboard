name: update-contests

on:
  schedule:
    - cron: "0 */6 * * *"     # 每 6 小时一次（UTC），比 30 分钟更稳，不易触发反爬；要 30 分钟就改回 "*/30 * * * *"
  workflow_dispatch:          # 允许手动触发

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python contest_tracker.py

      - name: Commit and push contests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contests.json contests.ics
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: update contests [skip ci]"
            git push
          fi
