name: update-contests

on:
  schedule:
    - cron: "*/30 * * * *"   # 每 30 分钟（UTC 时间，注意换算）
  workflow_dispatch:          # 允许手动触发

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python contest_tracker.py

      - name: Commit contests.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contests.json
          git diff --staged --quiet && echo "无变化，跳过提交" || git commit -m "chore: update contests.json [skip ci]"
          git push
